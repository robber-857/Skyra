services:
  - type: web
    name: skyra-booking-web
    runtime: docker
    branch: bookingdev
    rootDir: booking-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: 0.5c-512mb
    dockerCommand: npm run start:render
    preDeployCommand: npm run migrate:deploy
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SHOPIFY_API_KEY
        value: c9d266a38e2f11a1240139974253b3a1
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,write_metaobjects,read_metaobjects,write_metaobject_definitions,read_metaobject_definitions,write_app_proxy,unauthenticated_read_product_listings
      - key: DATABASE_URL
        fromDatabase:
          name: skyra-booking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skyra-booking-queue
          property: connectionString

  - type: keyvalue
    name: skyra-booking-queue
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: skyra-booking-db
    databaseName: skyra_booking
    user: skyra_booking
    region: singapore
    plan: 0.1c-256mb
    ipAllowList: []
