  <style>
    :root{--ink:#18201f;--muted:#66706e;--line:#d9dfdd;--soft:#f4f6f5;--paper:#fff;--green:#087f67;--green2:#e9f6f2;--brown:#6a471e;--danger:#b42318;--warn:#9a6700}
    *{box-sizing:border-box} body{margin:0;background:#eef1ef;color:var(--ink);font:14px/1.45 Inter,Arial,sans-serif}.skip{position:fixed;left:12px;top:8px;z-index:20;background:#fff;color:#111;padding:10px 14px;border-radius:7px;transform:translateY(-160%)}.skip:focus{transform:none}
    button,input,select{font:inherit}button{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(44,110,203,.35);outline-offset:2px}.top{height:58px;background:#202624;color:white;display:flex;align-items:center;padding:0 20px;gap:18px;position:sticky;top:0;z-index:5}
    .brand{font:700 20px Georgia,serif;color:#ead9bc}.top small{color:#bfc8c5}.roles{margin-left:auto;display:flex;gap:6px}.role{border:1px solid #59615f;background:transparent;color:white;padding:8px 12px;border-radius:8px;cursor:pointer}.role.active{background:white;color:#18201f}
    .notice{background:#fff4db;border-bottom:1px solid #ead69d;padding:10px 20px;color:#5f4a13}.shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 96px)}
    aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.surface{padding:10px 12px;margin-bottom:14px;border-radius:8px;background:var(--green2);color:#075e4e;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    nav button{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:9px 10px;border-radius:7px;color:#37413f;cursor:pointer;margin:3px 0}nav button:hover{background:#f0f3f2}nav button.active{background:var(--green2);border-left-color:var(--green);color:#111}nav button strong{display:block;font-size:13px}nav button span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
    .section-label{font-size:11px;color:#89918f;text-transform:uppercase;letter-spacing:.1em;padding:15px 12px 5px}.main{padding:28px;overflow:auto;min-width:0}.page{max-width:1250px;min-width:0;margin:auto}.eyebrow{color:var(--green);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    h1{font:650 31px/1.15 Inter,Arial,sans-serif;letter-spacing:-.025em;margin:8px 0 6px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0}.sub{color:var(--muted);max-width:800px;margin-bottom:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar .spacer{flex:1}
    .btn{border:1px solid #aeb7b4;background:white;padding:10px 14px;border-radius:7px;cursor:pointer}.btn:hover{background:#f1f4f3}.btn.primary{background:#222;color:#fff;border-color:#222}.btn.primary:hover{background:#000}.btn.green{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--danger)}
    .input{border:1px solid #b8c0bd;border-radius:7px;background:#fff;padding:9px 12px;min-width:170px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
    .metric strong{display:block;font-size:27px;margin-top:8px}.metric small,.muted{color:var(--muted)}.tag{display:inline-block;border-radius:999px;background:#edf1f0;padding:3px 8px;font-size:12px}.tag.ok{background:#e5f5ef;color:#07624f}.tag.warn{background:#fff2d6;color:#725000}.tag.bad{background:#feeceb;color:#962b22}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:#69726f;text-transform:uppercase;letter-spacing:.06em;background:#f5f7f6}.link{color:var(--green);font-weight:650}.kebab{font-weight:bold;letter-spacing:2px}
    .flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.step{background:#fff;border:1px solid #bfc8c5;border-radius:8px;padding:9px 11px}.arrow{color:#8b9491}.week{display:grid;grid-template-columns:70px repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:white}.week>div{min-height:64px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.week .head{min-height:auto;background:#f4f6f5;font-weight:700}.slot{font-size:12px;background:#eaf4ff;border-left:3px solid #4d88c7;border-radius:4px;padding:6px;margin-bottom:5px}.slot.green{background:#e8f5ef;border-color:#198767}.slot.strike{opacity:.48;text-decoration:line-through}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field .box{height:40px;background:#fff;border:1px solid #b8c0bd;border-radius:7px;padding:9px}.field.full{grid-column:1/-1}.wizard{display:flex;gap:0;margin:15px 0 22px}.wizard div{flex:1;border-bottom:3px solid #d6dcda;padding:8px;color:#77817e;font-size:12px}.wizard div.done{border-color:var(--green);color:var(--green);font-weight:700}
    .split{display:grid;grid-template-columns:1fr 350px;gap:16px}.summary{background:#f7f8f7;border:1px solid var(--line);border-radius:8px;padding:16px}.timeline{border-left:2px solid #ced6d3;margin-left:8px;padding-left:18px}.timeline p{margin:0 0 16px}.footer-note{margin-top:22px;padding:13px;border:1px dashed #aeb8b4;border-radius:8px;color:#5d6764;background:#fafbfa}
    .purpose{display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:12px 14px;border:1px solid #bfd8d1;background:#f3faf7;border-radius:8px;color:#36554e}.purpose strong{color:#075e4e;white-space:nowrap}.journey{display:grid;grid-template-columns:repeat(4,1fr);padding:0;overflow:hidden;margin-bottom:18px}.journey div{padding:14px;border-right:1px solid var(--line)}.journey div:last-child{border:0}.journey b{display:block;font-size:13px;margin-bottom:3px}.journey span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 0 16px}.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 14px;color:var(--muted);font-weight:700}.tab.active{border-bottom-color:var(--green);color:var(--ink)}.section-head{display:flex;align-items:center;gap:10px}.section-head .spacer{flex:1}.report-block{border-top:4px solid var(--green)}.source-note{color:var(--muted);font-size:12px;margin-top:12px}.mobile-card{max-width:440px;margin:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:#4d88c7}.dot.green{background:#198767}.dot.orange{background:#cf7a26}.account-strip{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:16px}.account-strip .spacer{flex:1}.credit-bar{height:8px;background:#e4e9e7;border-radius:999px;overflow:hidden;margin:10px 0}.credit-bar span{display:block;height:100%;background:var(--green)}.note{border-left:3px solid var(--green);background:#f4faf8;padding:12px 14px;border-radius:0 8px 8px 0}.list-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row .grow{flex:1}.amount{font-weight:700;white-space:nowrap}.hidden{display:none!important}
    @media(max-width:900px){.top{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 14px}.top small{display:none}.roles{order:3;width:100%;margin-left:0;display:flex;overflow:visible}.roles .role{flex:1}.shell{display:block;min-width:0;width:100%}aside{position:static;border-right:0;padding:10px 12px;min-width:0;width:100%;overflow:hidden}.surface,.section-label{display:none}nav{display:flex;gap:6px;max-width:100%;min-width:0;overflow-x:auto;overflow-y:hidden}nav button{min-width:max-content;border-left:0;border-bottom:3px solid transparent}nav button.active{border-bottom-color:var(--green)}nav button span{display:none}.main{padding:18px;min-width:0;width:100%;overflow:hidden}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}.split{grid-template-columns:1fr}.week{display:block;width:100%}.week>div{display:none}.week .slot{display:block;margin:8px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.journey{grid-template-columns:1fr 1fr}.journey div:nth-child(2){border-right:0}.purpose{display:block}.purpose strong{display:block;margin-bottom:4px}.toolbar .spacer{display:none}.input{min-width:0;max-width:100%}.account-strip{align-items:flex-start;flex-wrap:wrap}.list-row{flex-wrap:wrap}table{font-size:12px;table-layout:fixed}th,td{padding:9px 6px;word-break:break-word}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

  <script>
    const pages={
      admin:[
        ['overview','Overview',"Today's work & pass alerts"],['people','People','Customers & coaches'],['classes-passes','Classes & Passes','Define what you offer'],['weekly-schedule','Weekly Schedule','Assign time & coach'],['bookings','Bookings','Manage reservations'],['reports','Reports','Export spend & unused passes'],['settings','Settings','Policies & integrations']
      ],
      customer:[['storefront','Home / Programs Booking','Complete steps in one section'],['customer-home','My Overview','Credits, next visits & notes'],['my-passes','My Passes','Balance, expiry & usage'],['my-bookings','Bookings & History','Upcoming and past activity'],['appointments','Appointments','Private sessions & coach notes']],
      coach:[['coach-today','Today'],['coach-roster','Roster'],['coach-availability','Availability'],['coach-session','Session Detail'],['coach-report','My Reports']]
    };
    const common={
      overview:`<div class="eyebrow">Admin · Start here</div><h1>Overview</h1><p class="sub">Today's work, booking issues and customer Passes nearing expiry.</p><div class="journey card"><div><b>1 · Define</b><span>Create class types and Pass packages.</span></div><div><b>2 · Schedule</b><span>Choose this week's time and coach.</span></div><div><b>3 · Operate</b><span>Manage bookings and attendance.</span></div><div><b>4 · Review</b><span>Export spend and unused Pass reports.</span></div></div><div class="grid"><div class="card metric span-4">Classes today<strong>7</strong><small>31 / 42 places booked</small></div><div class="card metric span-4">Bookings needing action<strong>2</strong><small>1 payment hold · 1 waitlist</small></div><div class="card metric span-4">Passes expiring in 30 days<strong>24</strong><small>87 unused class credits</small></div><div class="card span-7"><div class="section-head"><h2>Today's classes</h2><span class="spacer"></span><button class="btn" onclick="openPage('weekly-schedule')">View schedule</button></div><table><tr><th>Time</th><th>Class</th><th>Coach</th><th>Booked</th><th>Status</th></tr><tr><td>10:00</td><td class="link">Aerial Flow + Stretch</td><td>Karen Song</td><td>5 / 6</td><td><span class="tag ok">Ready</span></td></tr><tr><td>11:20</td><td class="link">Aerial Pilates</td><td>Karen Song</td><td>6 / 6</td><td><span class="tag warn">Waitlist 2</span></td></tr><tr><td>17:45</td><td class="link">Beginner Aerial Yoga</td><td>Stacie Wang</td><td>3 / 6</td><td><span class="tag ok">Ready</span></td></tr></table></div><div class="card span-5"><div class="section-head"><h2>Pass expiry alerts</h2><span class="spacer"></span><button class="btn" onclick="openPage('people')">All customers</button></div><table><tr><th>Customer / Pass</th><th>Remaining</th><th>Expires</th></tr><tr><td><strong>Fionn Wu</strong><br><span class="muted">10 Aerial</span></td><td>3 / 10</td><td><span class="tag bad">5 days</span></td></tr><tr><td><strong>Ailey Ren</strong><br><span class="muted">Aerial Intro</span></td><td>1 / 2</td><td><span class="tag warn">8 days</span></td></tr><tr><td><strong>Queenie Loh</strong><br><span class="muted">10 Aerial</span></td><td>7 / 10</td><td><span class="tag warn">18 days</span></td></tr></table></div></div>`,
      'weekly-schedule':`<div class="eyebrow">Admin · Weekly planning</div><h1>Weekly Schedule</h1><p class="sub">Plan one week at a time: choose a class, set its actual start time and assign the coach.</p><div class="purpose"><strong>This page answers three questions</strong><span>Which class runs? When does it run? Who teaches it? Change prices, duration and Pass rules in Classes & Passes.</span></div><div class="toolbar"><button class="btn">Previous week</button><button class="btn">7–13 Sep 2026</button><button class="btn">Next week</button><select class="input"><option>All coaches</option><option>Karen Song</option><option>Stacie Wang</option></select><span class="spacer"></span><button class="btn">Copy last week</button><button class="btn primary">Publish week</button></div><div class="week"><div class="head"></div><div class="head">Mon 7</div><div class="head">Tue 8</div><div class="head">Wed 9</div><div class="head">Thu 10</div><div class="head">Fri 11</div><div class="head">Sat 12</div><div class="head">Sun 13</div><div class="head">Morning</div><div></div><div class="slot">10:00 Aerial Flow<br>Karen · 5/6</div><div class="slot">11:00 Pilates<br>Karen · 4/6</div><div class="slot">10:00 Flow + Stretch<br>Karen · 6/6</div><div></div><div class="slot">10:00 Beginner<br>Stacie · 3/6</div><div></div><div class="head">Afternoon</div><div></div><div></div><div></div><div></div><div class="slot">12:00 Hip-Hop<br>Max · 8/12</div><div class="slot">13:00 Aerial Flow<br>Karen · 4/6</div><div></div><div class="head">Evening</div><div class="slot green">17:45 Beginner<br>Stacie · Draft</div><div></div><div class="slot">18:30 Stretch<br>Karen · 5/6</div><div></div><div class="slot">18:30 Stretch<br>Karen · 3/6</div><div></div><div></div></div><div class="grid" style="margin-top:16px"><div class="card span-7"><h2>Add class to this week</h2><div class="form"><div class="field full"><label>Class</label><select class="input"><option>Aerial Flow + Stretch</option><option>Aerial Pilates</option><option>Beginner Aerial Yoga</option></select></div><div class="field"><label>Date</label><input class="input" type="date" value="2026-09-10"></div><div class="field"><label>Start time</label><input class="input" type="time" value="10:00"></div><div class="field"><label>Coach</label><select class="input"><option>Karen Song · Available</option><option>Stacie Wang · Available</option></select></div><div class="field"><label>Capacity</label><input class="input" type="number" value="6"></div></div><div class="toolbar"><span class="tag ok">No coach or room conflict</span><span class="spacer"></span><button class="btn primary">Add to week</button></div></div><div class="card span-5"><h2>Week status</h2><p><span class="tag warn">1 draft change</span></p><p>18 published classes</p><p>3 active coaches</p><p>Publishing sends the updated schedule to assigned coaches.</p></div></div>`,
      'classes-passes':`<div class="eyebrow">Admin · Offer setup</div><h1>Classes & Passes</h1><p class="sub">One place to define what customers can book and what they can buy.</p><div class="purpose"><strong>Clear ownership</strong><span>Class setup stores name, drop-in price, duration, capacity and defaults. Pass setup stores sale price, credits, validity and eligible classes. Weekly dates and assigned coaches are set on Weekly Schedule.</span></div><div class="grid"><div class="card span-7"><div class="section-head"><h2>Add or edit a class</h2><span class="spacer"></span><span class="tag">Class definition</span></div><div class="form"><div class="field full"><label>Class name</label><input class="input" value="Aerial Flow + Stretch"></div><div class="field"><label>Category</label><select class="input"><option>Aerial Movement</option><option>Dance Classes</option><option>Private Training</option></select></div><div class="field"><label>Level</label><select class="input"><option>Open level</option><option>Beginner</option><option>Intermediate</option></select></div><div class="field"><label>Drop-in price</label><input class="input" type="number" value="49"></div><div class="field"><label>Duration</label><select class="input"><option>55 minutes</option><option>60 minutes</option><option>90 minutes</option></select></div><div class="field"><label>Default capacity</label><input class="input" type="number" value="6"></div><div class="field"><label>Default location</label><select class="input"><option>Skyra Studio · Studio A</option></select></div><div class="field"><label>Suggested day</label><select class="input"><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div><div class="field"><label>Suggested start time</label><input class="input" type="time" value="10:00"></div><div class="field full"><label>Eligible coaches</label><div class="box">Karen Song × &nbsp; Stacie Wang × &nbsp; + Add coach</div></div></div><div class="toolbar"><span class="muted">Suggested time is a shortcut only; it does not publish a session.</span><span class="spacer"></span><button class="btn primary">Save class</button></div></div><div class="card span-5"><div class="section-head"><h2>Pass package setup</h2><span class="spacer"></span><span class="tag">Shopify + Booking DB</span></div><div class="field"><label>Pass name</label><input class="input" value="10 Aerial Classes" style="width:100%"></div><br><div class="form"><div class="field"><label>Shopify price</label><input class="input" type="number" value="420"></div><div class="field"><label>Class credits</label><input class="input" type="number" value="10"></div><div class="field full"><label>Validity</label><select class="input" style="width:100%"><option>6 months from purchase</option><option>3 months from purchase</option><option>30 days from purchase</option></select></div><div class="field full"><label>Eligible classes</label><div class="box">All Aerial Movement classes ▾</div></div></div><p class="source-note">Shopify owns the product and sale price. Booking DB owns credits, validity, eligibility and usage ledger.</p><button class="btn green">Save Pass package</button></div><div class="card span-12"><div class="section-head"><h2>Existing classes</h2><span class="spacer"></span><button class="btn" onclick="openPage('weekly-schedule')">Go to weekly schedule</button></div><table><tr><th>Class</th><th>Drop-in</th><th>Duration</th><th>Capacity</th><th>Default</th><th>Status</th></tr><tr><td class="link">Aerial Flow + Stretch</td><td>A$49</td><td>55 min</td><td>6</td><td>Thu · 10:00</td><td><span class="tag ok">Bookable</span></td></tr><tr><td class="link">Aerial Pilates</td><td>A$49</td><td>55 min</td><td>6</td><td>Thu · 11:20</td><td><span class="tag ok">Bookable</span></td></tr><tr><td class="link">Beginner Aerial Yoga</td><td>A$49</td><td>55 min</td><td>6</td><td>Tue · 17:45</td><td><span class="tag ok">Bookable</span></td></tr></table></div><div class="card span-12"><div class="section-head"><h2>Existing Pass packages</h2><span class="spacer"></span><button class="btn">Open mapped Shopify products</button></div><table><tr><th>Pass</th><th>Price</th><th>Credits</th><th>Validity</th><th>Eligible classes</th><th>Sync</th></tr><tr><td class="link">Drop In Yoga</td><td>A$49</td><td>1</td><td>30 days</td><td>Aerial classes</td><td><span class="tag ok">Synced</span></td></tr><tr><td class="link">5 Aerial Access</td><td>A$220</td><td>5</td><td>3 months</td><td>Aerial classes</td><td><span class="tag ok">Synced</span></td></tr><tr><td class="link">10 Aerial Classes</td><td>A$420</td><td>10</td><td>6 months</td><td>Aerial classes</td><td><span class="tag ok">Synced</span></td></tr></table></div></div>`,

      checkout:`<div class="eyebrow">Native Shopify surface · not built by Booking App</div><h1>Continue to Shopify Checkout</h1><p class="sub">This prototype intentionally stops at the hand-off. Shopify renders customer details, discounts, gift cards, taxes and every configured payment method.</p><div class="split"><div class="card"><h2>Booking hold</h2><div class="list-row"><div class="grow"><strong>Aerial Flow + Stretch</strong><br><span class="muted">Thu 10 Sep · 10:00 · Karen Song</span></div><span class="tag warn">09:48 remaining</span></div><h2 style="margin-top:22px">Product added to Shopify Cart</h2><div class="list-row"><div class="grow"><strong>Drop In Yoga</strong><br><span class="muted">Shopify Product / Variant</span></div><span class="amount">A$49.00</span></div><button class="btn primary" style="width:100%">Open native Shopify Checkout</button><p class="source-note">The button opens the Cart checkoutUrl. The Booking App never collects card details.</p></div><aside class="summary"><h2>After Shopify payment</h2><div class="timeline"><p><strong>1 · Shopify confirms payment</strong><br><span class="muted">orders/paid webhook</span></p><p><strong>2 · Booking App grants the Pass</strong><br><span class="muted">Idempotent entitlement ledger</span></p><p><strong>3 · Held seat is confirmed</strong><br><span class="muted">Customer, coach and admin notified</span></p></div></aside></div>`,

      'coach-today':`<div class="eyebrow">Coach Portal · Mobile-first</div><h1>Today, Karen</h1><p class="sub">Only assigned schedule and minimum roster information are visible.</p><div class="grid"><div class="card span-4"><h2>10:00 · Aerial Flow + Stretch</h2><p>Room A · 5/6 booked</p><button class="btn green" onclick="openPage('coach-roster')">Open roster</button></div><div class="card span-4"><h2>11:20 · Aerial Pilates</h2><p>Room A · 6/6 · waitlist 2</p><button class="btn">Open roster</button></div><div class="card span-4"><h2>18:30 · Stretch + Inversions</h2><p>Room A · 3/6 booked</p><button class="btn">Open roster</button></div></div>`,

      'coach-availability':`<div class="eyebrow">Coach Portal</div><h1>Availability & Time Off</h1><div class="grid"><div class="card span-7"><h2>Recurring availability</h2><table><tr><th>Day</th><th>Hours</th><th>Status</th></tr><tr><td>Monday</td><td>09:00–20:00</td><td>Available</td></tr><tr><td>Tuesday</td><td>09:00–20:00</td><td>Available</td></tr><tr><td>Saturday</td><td>09:00–14:00</td><td>Available</td></tr></table><button class="btn">Edit weekly availability</button></div><div class="card span-5"><h2>Request time off</h2><div class="field"><label>Dates</label><div class="box">14–16 Sep 2026</div></div><br><div class="field"><label>Note</label><div class="box">Personal leave</div></div><br><button class="btn primary">Submit request</button></div></div>`,
      'coach-session':`<div class="eyebrow">Coach Portal</div><h1>Session Detail</h1><div class="split"><div class="card"><h2>Aerial Flow + Stretch</h2><p>Thu 3 Sep · 10:00–10:55</p><p>Skyra Studio · Room A · 6 aerial rigs</p><p>5 confirmed · 1 available · 0 waitlist</p><button class="btn green">Open roster</button> <button class="btn">Add operational note</button></div><aside class="summary"><h2>Need cover?</h2><p>Submit a substitution request. Admin assigns and notifies the replacement coach.</p><button class="btn">Request substitute</button></aside></div>`,

    let currentRole='admin', currentPage='overview';
    function renderNav(){const n=document.getElementById('nav');n.innerHTML='';const groups=currentRole==='admin'?{'Daily work':['overview','people','classes-passes','weekly-schedule','bookings','reports'],'Configuration':['settings']}:{Pages:pages[currentRole].map(x=>x[0])};for(const [g,ids] of Object.entries(groups)){const l=document.createElement('div');l.className='section-label';l.textContent=g;n.appendChild(l);ids.forEach(id=>{const row=pages[currentRole].find(x=>x[0]===id);if(!row)return;const b=document.createElement('button');b.innerHTML='<strong>'+row[1]+'</strong>'+(row[2]?'<span>'+row[2]+'</span>':'');b.className=id===currentPage?'active':'';b.setAttribute('aria-current',id===currentPage?'page':'false');b.onclick=()=>openPage(id);n.appendChild(b)})}}
    function openBookingStep(step){document.querySelectorAll('[data-booking-pane]').forEach(p=>p.hidden=p.dataset.bookingPane!==step);document.querySelectorAll('[data-booking-step]').forEach(b=>b.classList.toggle('active',b.dataset.bookingStep===step));const pane=document.querySelector('[data-booking-pane="'+step+'"]');if(pane){pane.setAttribute('tabindex','-1');pane.focus()}}
    function openPage(id){currentPage=id;document.getElementById('content').innerHTML=common[id]||'<h1>Page</h1>';renderNav();if(id==='storefront')openBookingStep('browse');document.getElementById('main-content').focus();window.scrollTo(0,0)}
    document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentRole=b.dataset.role;currentPage=pages[currentRole][0][0];document.getElementById('surface').textContent=currentRole==='admin'?'Shopify Admin · Embedded App':currentRole==='customer'?'Shopify Storefront / Customer Account':'Coach Portal · App Authentication';openPage(currentPage)});
    openPage('overview');
