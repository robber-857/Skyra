name: skyra-booking
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skyra
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: skyra_booking
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyra -d skyra_booking"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - queue-data:/data
volumes:
  booking-data:
  queue-data:

